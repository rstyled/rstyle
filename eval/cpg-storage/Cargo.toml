[package]
name = "cpg-storage-bench"
version = "0.1.0"
edition = "2024"
publish = false

# Keep experiments and their codec dependencies outside the production workspace.
[workspace]

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
flatbuffers = "=25.12.19"
flexbuffers = "=25.12.19"
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zstd = "=0.14.3"

[profile.release]
debug = 1
