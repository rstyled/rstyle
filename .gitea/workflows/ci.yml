name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pinned nightly (+ rustc-dev etc.) comes from rust-toolchain.toml.
      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Dog-food: rstyle on its own workspace. Exit 1 = violations, 2 = tool error.
      - name: rstyle self-check
        run: |
          ./scripts/style.sh --format json > rstyle-report.json || status=$?
          cat rstyle-report.json
          exit "${status:-0}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rstyle-report
          path: rstyle-report.json
