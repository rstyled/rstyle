[package]
name = "rstyle-pdg"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
jsonschema = "0.33"

[lints]
workspace = true
