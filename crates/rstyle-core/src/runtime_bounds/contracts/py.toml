# Library operation contracts for the Python frontend.
#
# Extension roles: how runtime bounds lower a node the profile registers for Python, by its name
# without the `py:` namespace. The node evaluates its children once, in the order the registry
# writes them, and a child that is a pattern is a binding the node writes. `implicit` says when it
# also runs an operation the document names no callee for, which can reach a method a workspace
# type defines; runtime bounds read that operation as an unresolved call at the node.

schema = "rstyle.library-contracts/1"
namespace = "py"

[[extension]]
basis = "Joining an f-string's formatted fields and building a slice object run only the interpreter's own code"
implicit = "Never"
extensions = ["fstring", "slice"]

[[extension]]
basis = "Formatting a value calls its type's __format__, __str__ or __repr__; a dict display hashes and compares its keys and unpacks a ** entry's mapping; a starred expression iterates its operand; await runs the awaitable's __await__; an import can run the imported module's code"
implicit = "Always"
extensions = ["await", "dict", "format", "import", "star"]

[[extension]]
basis = "A keyword argument passes its value; one without a member is ** and unpacks a mapping through its keys and items"
implicit = "WithoutMember"
extensions = ["keyword"]

# Control roles: how a node raises an exception or handles one. Something raised inside a handled
# region reaches its handlers with every counter the region names unknown.

[[extension]]
basis = "raise evaluates its exception and its cause, and control does not pass"
control = "Throw"
extensions = ["raise"]

[[extension]]
basis = "assert evaluates its test, and its message only when the test fails, then raises AssertionError"
control = "Assert"
extensions = ["assert"]

[[extension]]
basis = "try runs its body and, when the body raises, an except clause or none; an else block runs only when the body doesn't raise and a finally block on every way out, so reading both as finally blocks only adds paths"
control = "Try"
handlers = ["except"]
extensions = ["try"]

[[extension]]
basis = "An except clause evaluates its exception type, which matches what was raised by the class hierarchy alone, binds what was raised, then runs its body"
extensions = ["except"]

[[extension]]
basis = "with evaluates each context and calls its __enter__, or __aenter__ in async with, binding what that returns; every way out of its body calls each context's __exit__, innermost first, and __exit__ can end an exception the body raised"
control = "With"
extensions = ["with"]
