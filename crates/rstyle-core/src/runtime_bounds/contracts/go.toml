# Library operation contracts for the Go frontend.
#
# Keys are the ones the frontend emits for the standard library: `<package path>.<name>`, with a
# method's receiver type between them, as in `sync.Once.Do`.
#
# Callable roles say how a function or method runs what it's handed: `runs` how often, `arity` the
# argument count after the receiver or the callee, and `callbacks` the indexes of the callables
# among them. Every other argument is evaluated before it, and the member does nothing else. Runtime
# bounds read one that runs its callable at most once as a branch around the callable.

schema = "rstyle.library-contracts/1"
namespace = "go"

[[allocation]]
basis = "The built-in allocator creates a fresh native slice header and backing storage with exactly the requested length; replacing an element invokes no setter and leaves the header's length unchanged. The type operand is static; length evaluation and allocation costs remain separate."
storage = "FreshNativeSequence"
arity = 2
type_argument = 0
length_argument = 1
operations = ["make"]

[[extent]]
basis = "The resolved built-in len returns a native slice's current length without changing its header. Map and channel lengths are not stable slice extents."
role = "Length"
operations = ["len"]

[[callable]]
basis = "Runs the function the first time it's called on this Once, and returns when that call has"
runs = "AtMostOnce"
arity = 1
callbacks = [0]
operations = ["sync.Once.Do"]

# Extension roles: how runtime bounds lower a node the profile registers for Go, by its name
# without the `go:` namespace. The node evaluates its children once, in the order the registry
# writes them, and `implicit` says when it also runs an operation the document names no callee for.

[[extension]]
basis = "Slicing reads and bounds-checks the operand's header and its bounds without calling anything"
implicit = "Never"
extensions = ["slice"]
