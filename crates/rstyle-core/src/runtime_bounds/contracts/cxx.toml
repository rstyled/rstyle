# Library operation contracts for the C and C++ frontend.
#
# Keys are `<class>.<member>`, the class by its own name in the standard library (`vector`,
# `basic_string`), or the function's name for a free function. The frontend emits them for the
# standard library's bodies, and core only reads one for a call that can't call back into workspace
# code, so a comparison or a copy of a workspace type never hides behind these steps.
#
# `steps` bounds element operations per invocation up to a constant factor, with `Size = i` the size
# of argument `i` (the receiver is argument 0). An operation that can allocate without bound, such as
# `vector.push_back`, is deliberately absent: without a contract it keeps an explicit opaque factor.
# So are the hash containers' lookups, whose worst case is linear and whose average isn't a bound.

schema = "rstyle.library-contracts/1"
namespace = "cxx"

[[contract]]
basis = "Balanced-tree search: tree height is logarithmic in the entry count"
steps = { Log = { Size = 0 } }
operations = [
  "map.contains",
  "map.count",
  "map.erase",
  "map.find",
  "map.lower_bound",
  "map.upper_bound",
  "set.contains",
  "set.count",
  "set.erase",
  "set.find",
  "set.lower_bound",
  "set.upper_bound",
]

[[contract]]
basis = "Reads a stored count or an element at a known place"
steps = { Const = 1 }
operations = [
  "array.empty",
  "array.size",
  "basic_string.empty",
  "basic_string.length",
  "basic_string.size",
  "basic_string_view.empty",
  "basic_string_view.length",
  "basic_string_view.size",
  "deque.empty",
  "deque.size",
  "list.empty",
  "list.size",
  "map.empty",
  "map.size",
  "set.empty",
  "set.size",
  "span.empty",
  "span.size",
  "vector.empty",
  "vector.size",
]

# Extent roles: members over a receiver whose entry count is stable while it's only read.

[[extent]]
basis = "Reads the stored entry count of a container"
role = "Length"
operations = [
  "array.size",
  "basic_string.length",
  "basic_string.size",
  "basic_string_view.length",
  "basic_string_view.size",
  "deque.size",
  "list.size",
  "span.size",
  "vector.size",
]
