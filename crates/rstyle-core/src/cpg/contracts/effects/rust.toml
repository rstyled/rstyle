# Effect classes of Rust standard library calls, keyed by operation without its namespace.
#
# A key is `<self type>.<member>`, as in the runtime bound contracts: the type an inherent member is
# defined on, by its compiler name (`Vec`, `BTreeMap`, `format_argument`) or its primitive kind (`slice`,
# `str`, `usize`). A free function's key is the path it's defined at, as its stable identity is:
# `core::mem::swap`, though a caller writes `std::mem::swap`, and `core::iter::sources::once::once`
# for `std::iter::once`.
#
# A call is classified by the implementation the document says it selects, and by its declared callee
# when it names none. A trait implementation's member is keyed by its type, like any other member: `?`
# on a `Result` runs `Result.branch`, and `String`'s `clone` is `String.clone`. One for a type with no
# compiler name, such as the `T` of a blanket implementation, `&Vec<T>`, `[T; N]` or `vec::IntoIter<T>`,
# is keyed by the path it's defined at, as a free function is: every `to_string` runs
# `alloc::string::{impl#39}::to_string`. That path numbers the implementations in its module, so a new
# nightly can move it onto another implementation of the same member. A test in `cargo-rstyle`,
# `the_effect_table_path_keys_name_the_implementations_they_were_checked_against`, names what each one
# was checked against, and fails when one moves. A call to a workspace implementation is followed
# through its call edge instead.
#
# A trait's own member is keyed by the trait (`Clone.clone`, `Iterator.next`) and stands for whichever
# implementation runs, and some do more than others: `io::Lines`'s `next` reads. A call is classified by
# it only where the document names no implementation, as in a generic body, so no trait member is
# listed here.
#
# `none` lists members that are pure for every type they're called with. They don't do IO, touch
# globals, the environment, the clock or randomness; they take no callable, have no bound through
# which a caller's type runs code (`Ord`, `Hash`, `Deref`, `Clone`, `Default`, `From`, `Iterator`), and
# drop no value of a type parameter. So `Option`'s `clone`, which runs its element's, isn't listed, and
# nor is `Result.from_residual`, which converts the error with `From`. One that writes through
# `&mut self`, as `Option.replace` does, writes the caller's own place, which core counts from the
# borrow. An `unsafe` member can be listed, since core counts the `unsafe` block it's called in.
#
# Allocating and freeing memory is no effect, as `append` and `make_unique` are none in Go's and C++'s
# tables, and neither is running out of memory, which aborts. A `Vec`'s allocator, which only nightly
# code can supply, counts as allocating.
#
# A member that panics only on a bad argument is none too, as Go's `make` and `regexp.MustCompile` and
# C++'s `vector.at` are: `Vec.with_capacity` for more than `isize::MAX` bytes, `Vec.remove` for an
# index past the end, `Option.unwrap` on `None`, and `Vec.push` on a `Vec` that can't grow. What a
# panic drops as it unwinds, such as the element `Vec.insert` was given, is the panic's. A member that
# always panics, aborts or exits isn't listed.
#
# Formatting into a `String` is no effect, as Go's `fmt.Sprintf` is none though it runs `String()`
# methods: the `Display` or `Debug` it runs is the value's own code, which counts where it's defined.
# So `alloc::fmt::format`, which every `format!` calls, is listed, and so are `Result.unwrap` and
# `expect`, which panic with the error's `Debug`. Writing what's formatted somewhere else isn't, as
# Go's `fmt.Fprintf` is io: `Formatter`'s methods write to whatever the formatting started with,
# which for `write!` to an `io::Write` is that writer. `ToString`'s blanket implementation, which formats
# the value with its `Display`, is listed by its path. `FmtWrite.write_fmt`, which `write!` to a
# `String` calls, is the trait's own member, since `String` doesn't implement it itself.
#
# A string entry covers every member whose name it starts: `slice.iter` is `iter_mut` too. An exact
# entry covers only the member it names, as `Option.is_some` needs, since `is_some_and` runs a callable.
# New entries are exact, so a member a later standard library adds isn't covered without being checked.

schema = "rstyle.effect-classes/1"
namespace = "rust"

# There's no `unlisted`. A Rust library call with no entry is any other standard member or free
# function, or a call into another crate, and stays unclassified: density doesn't count it, and a
# comparison reads it as unknown.

