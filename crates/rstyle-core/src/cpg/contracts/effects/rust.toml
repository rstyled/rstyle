# Effect classes of Rust standard library calls, keyed by operation without its namespace.
#
# A key is `<self type>.<member>`, as in the runtime bound contracts: the type an inherent member is
# defined on, by its compiler name (`Vec`, `BTreeMap`, `format_argument`) or its primitive kind (`slice`,
# `str`, `usize`). A free function such as `std::mem::take` has no key.
#
# A trait's member is keyed by the trait (`Clone.clone`, `Iterator.next`) whichever implementation runs,
# and some do more than others: `String`'s `clone` allocates, and `io::Lines`'s `next` reads. A call to
# a workspace implementation is followed through its call edge, but nothing follows a standard one, so
# no trait member is listed here.
#
# `none` lists members that are pure for every type they're called with. They don't allocate or free,
# do IO, touch globals, the environment, the clock or randomness, or panic; they take no callable, have
# no bound through which a caller's type runs code (`Ord`, `Hash`, `Deref`, `Clone`), and drop no value
# of a type parameter. One that writes through `&mut self`, as `Option.replace` does, writes the
# caller's own place, which core counts from the borrow. An `unsafe` member can be listed, since core
# counts the `unsafe` block it's called in.
#
# The longest entry that starts a key wins, so an entry covers every member whose name it starts:
# `slice.iter` is `iter_mut` too. That's why `Option.is_some` isn't here, since it would be
# `is_some_and` too, which runs a callable.

schema = "rstyle.effect-classes/1"
namespace = "rust"

# There's no `unlisted`. A Rust library call with no entry is any other standard member or free
# function, or a call into another crate, and stays unclassified: density doesn't count it, and a
# comparison reads it as unknown.

