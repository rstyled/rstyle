# Effect classes of C and C++ library calls, keyed by operation without its namespace.
#
# A key is `<class>.<member>` for a member, by the class's own name in the library, and the
# function's name otherwise. The longest entry that starts a key wins, so `vector.` is the whole class.
# Another library's key starts with the namespaces it's in, as `clang::Decl.isImplicit` or
# `llvm::sys::fs::remove`, so no standard entry starts it, and one in no namespace is `::name`.
#
# An overloaded operator isn't a call event, so `std::cout << x` has no entry here: its effect is the
# use of `std::cout`, a mutable global.

schema = "rstyle.effect-classes/1"
namespace = "cxx"

# A library call with no entry cannot be seen into, which holds for any library but the standard one
# and the calls into Clang and LLVM listed here.
unlisted = "unknown"

