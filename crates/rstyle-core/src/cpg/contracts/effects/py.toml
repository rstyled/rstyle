# Effect classes of Python standard library calls, keyed by operation without its namespace.
#
# A key is the qualified name typeshed declares a function or method at, with `builtins.` left off:
# `len`, `str.join`, `list.append`. Others keep their module, as typeshed spells it, which isn't always
# where a caller imports it from: `os.path.join` is `posixpath.join`, `os.path.exists` is
# `genericpath.exists`, a file's `write` is `_io._TextIOBase.write`, `warnings.warn` is `_warnings.warn`
# and `asyncio.sleep` is `asyncio.tasks.sleep`. A method is keyed by the class that defines it, so a
# subclass that doesn't override one shares its key, and one a project overrides is followed through
# its call edge instead.
#
# Python runs a value's own methods almost everywhere: `len(x)` runs `x.__len__`, `str(x)` runs
# `x.__str__`, `sorted(xs)` runs `__lt__` and `d[k]` runs `k.__hash__`. What a project's method does
# counts where it's defined, but only if the call is seen to reach it, and here it isn't, since the
# document names the library function. So `none` lists only what's pure whatever it's handed: it does
# no IO, touches no globals, the environment, the clock or randomness, calls nothing it's given, and
# runs no method of its arguments, as storing or returning one doesn't. `list.append` stores its
# argument, `typing.cast` returns it, and `BaseException.__init__` keeps them as `args`.
#
# `none_without_callback` lists what has no effect of its own but runs what it's handed. It's pure
# where the document says the call calls nothing of the workspace's back, which rstyle-py says when
# every argument is of a type whose methods are the library's: `isinstance(x, str)`, or `str.join` of a
# `list[str]`. Anywhere else the call stays unclassified, so `len` of a class that defines `__len__`
# isn't taken as pure.
#
# Allocating memory is no effect, nor is raising an exception for a bad argument: `int("x")` raises
# `ValueError`, as `Vec.remove` panics in Rust's table. A member that always exits is `panic`, as
# `exit` is in C++'s table.
#
# Writing to a file, a stream or a log is io, wherever it ends up: a log record goes to whatever
# handlers are configured, and a `StringIO`'s `write` shares the key of a file's. Setting up
# what's shared by the whole process is global: the environment, the working directory, signal
# handlers, warning filters and loggers, which `logging.getLogger` makes on first use. So is reading
# them: `os.getenv` is global, as `getenv` is in C++'s table, and so is a context variable, which
# a task carries.
#
# A string entry covers every member whose name it starts. Effects are listed by module where the
# whole module is one, as `subprocess.` and `shutil.` are, with any member that differs listed
# longer. Entries in `none` are exact, so a member a later Python adds isn't covered without being
# checked.

schema = "rstyle.effect-classes/1"
namespace = "py"

# There's no `unlisted`. A call with no entry is any other standard member, or a call into another
# package, and stays unclassified: density doesn't count it, and a comparison reads it as unknown.

