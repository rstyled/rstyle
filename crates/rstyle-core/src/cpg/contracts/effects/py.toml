# Each runs code that can't be seen from here: a string, a module's body or a pickle's.
unknown = [
    "__import__",
    "_pickle.load",
    "_pickle.loads",
    "eval",
    "exec",
    "importlib.import_module",
    "importlib.reload",
    "pickle.load",
    "pickle.loads",
