[package]
name = "rstyle-core"
version.workspace = true
edition.workspace = true

[dependencies]
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14.3"

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[lints]
workspace = true
