[package]
name = "cargo-rstyle"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rstyle-core = { path = "../rstyle-core" }
rstyle-pdg = { path = "../rstyle-pdg" }
rstyle-ccgraph = { path = "../rstyle-ccgraph" }
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# SHA-2 0.10 only enables its runtime-detected ARM SHA-256 backend with `asm`.
# Preserve the software fallback and the original dev/test build profile.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
adler2 = "=2.0.1"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
syn = { version = "2", features = ["full"] }
tempfile = "3"

[lints]
workspace = true
