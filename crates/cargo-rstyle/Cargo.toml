[package]
name = "cargo-rstyle"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rstyle-core = { path = "../rstyle-core" }
rstyle-pdg = { path = "../rstyle-pdg" }
rstyle-ccgraph = { path = "../rstyle-ccgraph" }
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints]
workspace = true
