[package]
name = "cargo-rstyle"
version.workspace = true
edition.workspace = true
default-run = "cargo-rstyle"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rstyle-core = { path = "../rstyle-core" }
rstyle-capture = { path = "../rstyle-capture" }
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# SHA-2 0.10 only enables its runtime-detected ARM SHA-256 backend with `asm`.
# Preserve the software fallback and the original dev/test build profile.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
adler2 = "=2.0.1"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints]
workspace = true
