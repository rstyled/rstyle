[package]
name = "rstyle-driver"
version.workspace = true
edition.workspace = true

[dependencies]
rstyle-core = { path = "../rstyle-core" }
rstyle-pdg = { path = "../rstyle-pdg" }
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
rstyle-ccgraph = { path = "../rstyle-ccgraph" }
rstyle-extraction-fixtures = { path = "../rstyle-extraction-fixtures" }
