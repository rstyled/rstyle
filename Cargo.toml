[workspace]
members = ["crates/rstyle-core", "crates/rstyle-driver", "crates/cargo-rstyle", "crates/rstyle-pdg", "crates/rstyle-ccgraph", "crates/rstyle-extraction-fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"

# Capture/replay tests parse and serialize substantial evidence. Optimize their
# hot dependencies while retaining normal debug builds of workspace code.
[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package."syn:2.0.119"]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 2
