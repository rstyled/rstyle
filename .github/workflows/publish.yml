name: Publish

# What rstyle-mcp-server's Check image takes from this repository (publish/Dockerfile): cargo-rstyle, rstyle-driver and
# rstyle, built for release on rstyle's base image. The Check image pins a commit or a version (its versions.json core).
# rstyled/release's image workflow builds it and, from main, publishes it as ghcr.io/rstyled/rstyle:<commit> and
# :latest, and, when the commit is a release, as :X.Y.Z, then tags the commit vX.Y.Z with a GitHub release. A commit is
# a release when a feat, fix, perf or breaking commit landed since the last one (Conventional Commits; rstyled/release's
# README). The Check image pulls it with its own GITHUB_TOKEN (this package's Actions access must list
# rstyled/rstyle-mcp-server, with Read). A pull request that changes how it's built builds it without publishing.
on:
  pull_request:
    paths: ['publish/**', '.github/workflows/publish.yml', 'rust-toolchain.toml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    uses: rstyled/release/.github/workflows/image.yml@v0.0
    with:
      dockerfile: publish/Dockerfile
      runs-on: ubuntu-24.04
      timeout-minutes: 60
