name: Publish

# Builds what rstyle-mcp-server's Check image takes from this repository (publish/Dockerfile): cargo-rstyle,
# rstyle-driver and rstyle, for release on rstyle's base image. Publishes them as ghcr.io/rstyled/rstyle:<commit> and
# :latest; the Check image pins a commit (its versions.json core) and pulls it with its own GITHUB_TOKEN (this package's
# Actions access must list rstyled/rstyle-mcp-server, with Read). The base is private, so a fork's pull request can't
# build it; a pull request from this repository that changes how it's built builds it without publishing.
on:
  pull_request:
    paths: ['publish/**', '.github/workflows/publish.yml', 'rust-toolchain.toml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish to GHCR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, and from main publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          # The base is private: pulling it takes this repository's login.
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          set -- --file publish/Dockerfile --provenance=false --tag "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            set -- "$@" --tag "$IMAGE:latest" --push
          fi
          docker buildx build "$@" .
          docker logout ghcr.io
