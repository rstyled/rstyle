name: PDG compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gstyle_ref:
        description: Go branch, tag or commit
        default: master
        type: string
      rstyle_ref:
        description: Rust ref override; empty tests the selected workflow commit
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    uses: rstyled/compat/.github/workflows/compat.yml@7366049160309bb0a764c57f7e07ae543a039048
    with:
      compat_ref: 7366049160309bb0a764c57f7e07ae543a039048
      gstyle_ref: ${{ inputs.gstyle_ref || 'master' }}
      rstyle_ref: ${{ inputs.rstyle_ref || github.sha }}
