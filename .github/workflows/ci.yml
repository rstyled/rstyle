name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Installs the pinned nightly and components from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      # Prebuild the driver before process-based tests; includes doctests separately.
      - name: Tests
        run: CARGO_TARGET_DIR=target ./scripts/test.sh --nextest

      # Dog-food: rstyle on its own workspace. Exit 1 = violations, 2 = tool error.
      - name: rstyle self-check
        run: |
          ./scripts/style.sh --format json > rstyle-report.json || status=$?
          cat rstyle-report.json
          exit "${status:-0}"

      # Dog-food: merge candidates. Fix each one or dismiss it after review with
      # `cargo rstyle ignore <id> --reason "..."` (committed in rstyle-ignore.toml).
      # Exit 1 = candidates nobody has reviewed.
      - name: rstyle patterns
        run: ./scripts/style.sh patterns --fail-on-candidates --show-ignored

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rstyle-report-${{ runner.arch }}
          path: rstyle-report.json
          if-no-files-found: warn
