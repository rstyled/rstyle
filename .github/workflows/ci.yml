name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Installs the pinned nightly and components from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Python CI helpers
        run: |
          python3 -m unittest discover -s scripts -p test_watchdog.py
          python3 -m unittest discover -s scripts -p test_measure_ci.py
          python3 -m unittest discover -s scripts -p test_ci_style.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      - name: Install coverage tool
        if: matrix.runner == 'ubuntu-24.04'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # Prebuild the workspace test graph; includes doctests separately.
      - name: Tests
        id: tests
        env:
          CARGO_TARGET_DIR: ${{ matrix.runner == 'ubuntu-24.04' && format('{0}/rstyle-coverage', runner.temp) || 'target' }}
        run: |
          if [ "${{ matrix.runner }}" = ubuntu-24.04 ]; then
            ./scripts/coverage.sh
          else
            ./scripts/test.sh --nextest
          fi

      # Coverage builds live outside the normal Cargo cache. Style capture uses
      # ordinary binaries, with no coverage flags or profile environment.
      - name: Build style binaries
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo build --locked -p cargo-rstyle -p rstyle-driver

      - name: Annotate test failures
        if: failure()
        run: python3 scripts/ci-test-failures.py target/nextest/ci/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}-${{ runner.arch }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      - name: Retain coverage report
        if: always() && matrix.runner == 'ubuntu-24.04' && steps.tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-x64
          path: target/coverage/lcov.info
          if-no-files-found: warn

      # Capture graph-rich evidence once, preserve both presentations, then
      # apply numeric and pattern exit statuses as independent gates in order.
      - name: rstyle self-check
        run: |
          test -x target/debug/cargo-rstyle || exit 2
          test -x target/debug/rstyle-driver || exit 2
          output="$(mktemp -d target/rstyle-ci.XXXXXX)"
          echo "RSTYLE_CI_OUTPUT=$output" >> "$GITHUB_ENV"
          python3 scripts/ci-style.py --binary target/debug/cargo-rstyle --output "$output/results" || status=$?
          cp "$output/results/rstyle-report.json" rstyle-report.json || exit 2
          exit "${status:-0}"

      - name: rstyle patterns
        run: python3 scripts/ci-style.py --output "$RSTYLE_CI_OUTPUT/results" --patterns-status

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rstyle-report-${{ runner.os }}-${{ runner.arch }}
          path: |
            rstyle-report.json
            ${{ env.RSTYLE_CI_OUTPUT }}/results/rstyle-patterns.json
            ${{ env.RSTYLE_CI_OUTPUT }}/results/patterns-capture-report.json
            ${{ env.RSTYLE_CI_OUTPUT }}/results/status.json
          if-no-files-found: warn

  coverage:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-linux-x64
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
